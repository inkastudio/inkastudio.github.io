<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inka Studio | Home</title>
    <style>
        /* CORE RESET & VARIABLES */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-dark: #050505;
            --text-light: #f4f4f5;
            --accent-cyan: #00f0ff; /* Neon/Cyberpunk blue vibe */
            --glass-bg: rgba(15, 15, 15, 0.7);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow-x: hidden;
        }

        /* GLASSMORPHISM NAVBAR */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            height: 80px;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5%;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-light);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent-cyan);
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
        }

        /* HERO SECTION (CINEMATIC SPLASH) */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            /* Placeholder for Dead Ignition Background Art */
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(5,5,5,1) 100%), 
                        url('https://images.unsplash.com/photo-1616423640778-28d1b53229bd?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') center/cover;
            padding: 0 20px;
        }

        .hero h1 {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 2px;
            margin-bottom: 40px;
            color: #a1a1aa;
        }

        /* AAA BUTTON STYLING */
        .btn-primary {
            background-color: transparent;
            color: var(--text-light);
            padding: 16px 40px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid var(--accent-cyan);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-primary:hover {
            background-color: var(--accent-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
        }

        /* DEEP FOOTER */
        footer {
            background-color: #000;
            padding: 40px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            font-size: 0.8rem;
            color: #52525b;
        }

        .footer-links a {
            color: #52525b;
            text-decoration: none;
            margin-left: 20px;
            transition: 0.2s;
        }

        .footer-links a:hover {
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .nav-links { display: none; } /* We will add a mobile menu later */
            footer { flex-direction: column; gap: 20px; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <nav>
        <a href="/" class="logo">Inka<span>Studio</span></a>
        <div class="nav-links">
            <a href="/games">Games</a>
            <a href="/news">News</a>
            <a href="/studio">Studio</a>
            <a href="/support">Support</a>
        </div>
    </nav>

    <!-- MAIN HERO SECTION -->
    <header class="hero">
        <h1>Dead Ignition</h1>
        <p>The flagship survival experience. In development.</p>
        <!-- This button links exactly to the subpage we talked about -->
        <a href="/games/dead-ignition" class="btn-primary">Explore Project</a>
    </header>

    <!-- FOOTER -->
    <footer>
        <div class="copyright">
            &copy; 2026 Inka Studio. All rights reserved.
        </div>
        <div class="footer-links">
            <a href="/legal/terms">Terms of Service</a>
            <a href="/legal/privacy">Privacy Policy</a>
            <a href="/studio/contact">Contact</a>
        </div>
    </footer>

</body>
</html>
